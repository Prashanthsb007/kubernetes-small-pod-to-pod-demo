apiVersion: v1
kind: Service
metadata:
  name: backend-service      # <-- other pods reach the backend using this name
spec:
  type: ClusterIP            # internal-only virtual IP (default Service type)
  selector:
    app: backend             # sends traffic to any pod labeled app=backend
  ports:
  - port: 80                 # port exposed by the Service
    targetPort: 80           # port the nginx container is listening on
